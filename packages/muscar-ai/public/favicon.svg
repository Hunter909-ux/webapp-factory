<!--
  muscar.ai favicon — simplified mycelium node, 32×32 viewBox.
  The build also references this from the Base layout via <link rel="icon" />.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
  role="img"
  aria-label="muscar.ai"
>
  <g stroke="#C84B31" stroke-width="1.5" stroke-linecap="round" fill="none">
    <line x1="16" y1="16" x2="8" y2="8" />
    <line x1="16" y1="16" x2="26" y2="10" />
    <line x1="16" y1="16" x2="24" y2="26" />
    <line x1="16" y1="16" x2="6" y2="24" />
  </g>
  <circle cx="8" cy="8" r="2" fill="#C84B31" />
  <circle cx="26" cy="10" r="2.5" fill="#C84B31" />
  <circle cx="24" cy="26" r="2" fill="#C84B31" />
  <circle cx="6" cy="24" r="2.5" fill="#C84B31" />
  <circle cx="16" cy="16" r="4" fill="#C84B31" />
</svg>
