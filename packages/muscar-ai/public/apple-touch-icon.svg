<!--
  Apple touch icon source — 180×180, symbol on Forest Floor with rounded corners.
  Rendered to apple-touch-icon.png during asset generation (Issue #18).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 180 180"
  width="180"
  height="180"
  role="img"
  aria-label="muscar.ai"
>
  <rect width="180" height="180" rx="36" fill="#1A1612" />
  <g transform="translate(90, 90)" stroke="#C84B31" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="-35" y2="-28" />
    <line x1="0" y1="0" x2="38" y2="-24" />
    <line x1="0" y1="0" x2="42" y2="24" />
    <line x1="0" y1="0" x2="-30" y2="35" />
    <line x1="-35" y1="-28" x2="38" y2="-24" />
    <line x1="38" y1="-24" x2="42" y2="24" />
    <line x1="42" y1="24" x2="-30" y2="35" />
  </g>
  <g transform="translate(90, 90)" fill="#C84B31">
    <circle cx="-35" cy="-28" r="6" />
    <circle cx="38" cy="-24" r="7" />
    <circle cx="42" cy="24" r="6" />
    <circle cx="-30" cy="35" r="7" />
    <circle cx="0" cy="0" r="12" />
  </g>
</svg>
