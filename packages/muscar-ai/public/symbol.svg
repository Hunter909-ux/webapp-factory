<!--
  muscar.ai mycelium symbol — abstracted network of 5–7 nodes.
  Spore Red on transparent background (Issue #18).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="100"
  height="100"
  role="img"
  aria-label="Mycelium node"
>
  <!-- connecting hyphae -->
  <g stroke="#C84B31" stroke-width="1" stroke-linecap="round" fill="none">
    <line x1="50" y1="50" x2="30" y2="33" />
    <line x1="50" y1="50" x2="72" y2="28" />
    <line x1="50" y1="50" x2="80" y2="58" />
    <line x1="50" y1="50" x2="58" y2="82" />
    <line x1="50" y1="50" x2="24" y2="66" />
    <line x1="50" y1="50" x2="40" y2="20" />
    <line x1="30" y1="33" x2="40" y2="20" />
    <line x1="72" y1="28" x2="80" y2="58" />
    <line x1="58" y1="82" x2="24" y2="66" />
  </g>

  <!-- outer nodes -->
  <g fill="#C84B31">
    <circle cx="30" cy="33" r="3" />
    <circle cx="72" cy="28" r="3.5" />
    <circle cx="80" cy="58" r="3" />
    <circle cx="58" cy="82" r="3" />
    <circle cx="24" cy="66" r="3.5" />
    <circle cx="40" cy="20" r="2.5" />
  </g>

  <!-- central node -->
  <circle cx="50" cy="50" r="6" fill="#C84B31" />
</svg>
